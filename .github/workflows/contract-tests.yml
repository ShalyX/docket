name: Docket contract checks

on:
  pull_request:
    paths:
      - "contracts/**"
      - "deploy/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - "gltest.config.yaml"
      - ".github/workflows/contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "deploy/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - "gltest.config.yaml"
      - ".github/workflows/contract-tests.yml"

permissions:
  contents: read

jobs:
  bootstrap-parity:
    name: Bootstrap contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install contract test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests against the bootstrap source
        run: python -m pytest --contracts-dir deploy/bootstrap
