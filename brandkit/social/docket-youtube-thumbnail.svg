<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Docket demo thumbnail</title>
  <desc id="desc">A real 70/30 settlement for a partially completed pull request.</desc>
  <rect width="1280" height="720" fill="#1e4437"/>
  <rect x="0" y="0" width="36" height="720" fill="#d85039"/>
  <text x="80" y="88" fill="#a9d7b5" font-family="monospace" font-size="18" letter-spacing="2">DOCKET · ONCHAIN JUSTICE</text>
  <text x="78" y="206" fill="#f4f0e7" font-family="Georgia, serif" font-size="64" font-weight="700">A partial PR.</text>
  <text x="78" y="282" fill="#f4f0e7" font-family="Georgia, serif" font-size="64" font-weight="700">A proportional payout.</text>
  <text x="78" y="366" fill="#d85039" font-family="Georgia, serif" font-size="88" font-style="italic" font-weight="700">70 / 30</text>
  <text x="82" y="430" fill="#d8e8d8" font-family="Arial, sans-serif" font-size="24">GenLayer validators judged the public GitHub evidence.</text>
  <g transform="translate(832 104)">
    <rect width="360" height="512" fill="#f4f0e7"/>
    <text x="28" y="48" fill="#d85039" font-family="monospace" font-size="12" letter-spacing="1.4">AI-ADJUDICATED RESULT</text>
    <text x="28" y="132" fill="#1e4437" font-family="Georgia, serif" font-size="78" font-weight="700">70%</text>
    <text x="28" y="168" fill="#45544c" font-family="Arial, sans-serif" font-size="18">of escrow awarded</text>
    <g transform="translate(28 214)">
      <rect width="304" height="68" fill="#dfeadd"/>
      <text x="18" y="26" fill="#1e4437" font-family="monospace" font-size="12">01 · 40% · PASS</text>
      <text x="18" y="49" fill="#1e4437" font-family="Arial, sans-serif" font-size="14">Observed behavior shipped</text>
      <rect y="80" width="304" height="68" fill="#dfeadd"/>
      <text x="18" y="106" fill="#1e4437" font-family="monospace" font-size="12">02 · 30% · PASS</text>
      <text x="18" y="129" fill="#1e4437" font-family="Arial, sans-serif" font-size="14">CI run verified</text>
      <rect y="160" width="304" height="68" fill="#f1d7cf"/>
      <text x="18" y="186" fill="#8d2f21" font-family="monospace" font-size="12">03 · 30% · FAIL</text>
      <text x="18" y="209" fill="#8d2f21" font-family="Arial, sans-serif" font-size="14">Receipt missing</text>
    </g>
    <rect x="28" y="466" width="213" height="12" fill="#71ae7b"/><rect x="241" y="466" width="91" height="12" fill="#d85039"/>
  </g>
  <text x="82" y="646" fill="#f4f0e7" font-family="monospace" font-size="15" letter-spacing="1.4">REAL CONTRACT · REAL PR · FINALIZED SETTLEMENT</text>
