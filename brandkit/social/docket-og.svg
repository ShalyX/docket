<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Docket — release what shipped</title>
  <desc id="desc">Docket turns public GitHub evidence into criterion-level settlement on GenLayer.</desc>
